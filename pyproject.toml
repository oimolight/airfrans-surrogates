[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airfrans-surrogates"
version = "0.1.0"
description = "Reproducible AirfRANS pressure-surrogate experiments with MLP, GNN, and FNO models"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "airfrans==0.1.5.1",
    "huggingface-hub>=1.31.0",
    "kaleido>=1.4.0",
    "plotly>=7.0.0",
    "torch>=2.14.0",
]

[project.scripts]
airfrans-edge-feature-ablation = "sciai.airfrans.cli:edge_feature_ablation"
airfrans-model-comparison = "sciai.airfrans.cli:model_comparison"
airfrans-model-comparison-evidence = "sciai.airfrans.cli:model_comparison_evidence"
sciai-check = "sciai.common.repository_check:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
